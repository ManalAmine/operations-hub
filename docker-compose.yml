services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: operations_hub
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - operations_hub_postgres:/var/lib/postgresql/data

volumes:
  operations_hub_postgres:
