services:
  - type: web
    name: operations-hub-api-manalamine
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: operations-hub-db-manalamine
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: AI_REQUESTS_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REQUEST_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_REQUEST_TIMEOUT_MS
        value: "30000"

  - type: web
    name: operations-hub-manalamine
    runtime: static
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: operations-hub-db-manalamine
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: operations_hub
    user: operations_hub
